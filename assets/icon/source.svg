<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="tapeTitle">
  <title id="tapeTitle">TAPE 磁带</title>

  <defs>
    <!-- 轴心：白色齿盘 + 六齿 -->
    <g id="hub">
      <circle r="14" fill="#E0E0E0"/>
      <g stroke="#757575" stroke-width="2.4" stroke-linecap="round">
        <line x1="0" y1="-6.6" x2="0" y2="-12.2"/>
        <line x1="0" y1="-6.6" x2="0" y2="-12.2" transform="rotate(60)"/>
        <line x1="0" y1="-6.6" x2="0" y2="-12.2" transform="rotate(120)"/>
        <line x1="0" y1="-6.6" x2="0" y2="-12.2" transform="rotate(180)"/>
        <line x1="0" y1="-6.6" x2="0" y2="-12.2" transform="rotate(240)"/>
        <line x1="0" y1="-6.6" x2="0" y2="-12.2" transform="rotate(300)"/>
      </g>
      <circle r="6.6" fill="#757575"/>
    </g>

    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F1F1"/>
      <stop offset="1" stop-color="#D9D9D9"/>
    </linearGradient>
  </defs>

  <!-- 壳体 · 224×144 = 100×64mm -->
  <rect x="16" y="56" width="224" height="144" rx="7" fill="#2E2E2E"/>
  <path d="M231 57.5H23A5.5 5.5 0 0 0 17.5 63V192.5"
        fill="none" stroke="#4A4A4A" stroke-width="2" stroke-linecap="round"/>

  <!-- 防消磁缺口 · 上缘两角 -->
  <rect x="28" y="56" width="16" height="6" rx="1" fill="#1B1B1B"/>
  <rect x="212" y="56" width="16" height="6" rx="1" fill="#1B1B1B"/>

  <!-- 标签 · 204×108，顶部红条 -->
  <rect x="26" y="62" width="204" height="108" rx="4" fill="#D6453A"/>
  <path d="M26 78H230V166A4 4 0 0 1 226 170H30A4 4 0 0 1 26 166Z" fill="#F2F2F2"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="38" y="74" font-size="11" font-weight="700" letter-spacing="3.2" fill="#FFFFFF">TAPE</text>
    <text x="218" y="73" text-anchor="end" font-size="7" letter-spacing="1.6" fill="#FFFFFF" opacity=".88">SIDE A · 60 MIN</text>
    <text x="38" y="91" font-size="7" letter-spacing="2.2" fill="#9E9E9E">STEREO · NORMAL BIAS</text>
  </g>

  <!-- 手写条 -->
  <rect x="38" y="96" width="52" height="5" rx="2.5" fill="#D6453A"/>
  <rect x="98" y="96" width="120" height="5" rx="2.5" fill="#E4E4E4"/>

  <!-- 卷轴窗 · 164×52 胶囊 -->
  <rect x="46" y="110" width="164" height="52" rx="26" fill="url(#glass)"/>
  <rect x="46" y="110" width="164" height="52" rx="26" fill="none" stroke="#B5B5B5" stroke-width="1.5"/>

  <!-- 磁带 · 跨接两卷 -->
  <rect x="62" y="130" width="132" height="12" fill="#2B2320"/>
  <circle cx="80" cy="136" r="23" fill="#2B2320"/>
  <circle cx="176" cy="136" r="23" fill="#2B2320"/>
  <use href="#hub" x="80" y="136"/>
  <use href="#hub" x="176" y="136"/>

  <!-- 磁头开窗 · 露带 + 导带孔 -->
  <path d="M84 200V180A8 8 0 0 1 92 172H164A8 8 0 0 1 172 180V200Z" fill="#1B1B1B"/>
  <rect x="84" y="175" width="88" height="11" fill="#2B2320"/>
  <rect x="84" y="175" width="88" height="1.2" fill="#5C4B43"/>
  <circle cx="99" cy="193" r="5" fill="none" stroke="#4A4A4A" stroke-width="1.5"/>
  <circle cx="157" cy="193" r="5" fill="none" stroke="#4A4A4A" stroke-width="1.5"/>

  <!-- 螺丝 -->
  <g stroke="#4A4A4A" stroke-width="1.5">
    <circle cx="35" cy="186" r="5" fill="#242424"/>
    <circle cx="221" cy="186" r="5" fill="#242424"/>
    <line x1="31.5" y1="186" x2="38.5" y2="186"/>
    <line x1="217.5" y1="186" x2="224.5" y2="186"/>
  </g>
</svg>